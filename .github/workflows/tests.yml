name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/ -q -rfE --tb=short 2>&1 | tee pytest.log
      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          # One annotation per failing test, visible on the run page without downloading logs
          grep -E "^(FAILED|ERROR) " pytest.log | head -10 | while read -r line; do echo "::error::${line}"; done
          { echo '```'; tail -n 120 pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
